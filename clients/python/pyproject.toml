[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kisscore-client"
version = "1.0.0"
description = "Zero-dependency Python client for KissCore API"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Muvon Un Limited", email = "hello@muvon.io"}]

[tool.setuptools.packages.find]
include = ["kisscore_client"]
